<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión | Stargym</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2L14.8 8.6L22 9.3L16.6 14.1L18.2 21.2L12 17.5L5.8 21.2L7.4 14.1L2 9.3L9.2 8.6L12 2Z' fill='%23b8e83e' stroke='%23823fef' stroke-width='1.5'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-page__card">
      <div style="display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.85rem;">
        <span class="logo-icon-emblem" aria-hidden="true" style="width: 1.8rem; height: 1.8rem;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L14.8 8.6L22 9.3L16.6 14.1L18.2 21.2L12 17.5L5.8 21.2L7.4 14.1L2 9.3L9.2 8.6L12 2Z" fill="url(#star-grad-login)" stroke="#b8e83e" stroke-width="1.5"/>
            <defs>
              <linearGradient id="star-grad-login" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                <stop stop-color="#823fef"/>
                <stop offset="1" stop-color="#b8e83e"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <p class="auth-page__brand" style="margin: 0;">Stargym Access</p>
      </div>
      <h1 class="auth-page__title">Iniciar sesión</h1>
      <p class="auth-page__subtitle">Accede para gestionar tus clases, reservas y progreso.</p>

      <form class="auth-form" id="login-page-form" novalidate>
        <label class="form-field">
          <span class="form-label">Correo electrónico</span>
          <input type="email" name="email" autocomplete="email" required placeholder="tu@email.com" />
        </label>
        <label class="form-field">
          <span class="form-label">Contraseña</span>
          <input type="password" name="password" autocomplete="current-password" required minlength="6" placeholder="******" />
        </label>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>

      <p class="auth-feedback" id="auth-page-feedback" hidden role="status"></p>
      
      
        
      </div>

      <p class="auth-page__footer">¿Aún no tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
      <p class="auth-page__footer"><a href="index.html">Volver al inicio</a></p>
    </main>

    <script src="js/auth-pages.js"></script>
  </body>
</html>
