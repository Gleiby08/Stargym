<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finalizar Compra | Stargym</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2L14.8 8.6L22 9.3L16.6 14.1L18.2 21.2L12 17.5L5.8 21.2L7.4 14.1L2 9.3L9.2 8.6L12 2Z' fill='%23b8e83e' stroke='%23823fef' stroke-width='1.5'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-page__card reveal is-visible">
      <div style="display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.85rem;">
        <span class="logo-icon-emblem" aria-hidden="true" style="width: 1.8rem; height: 1.8rem;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L14.8 8.6L22 9.3L16.6 14.1L18.2 21.2L12 17.5L5.8 21.2L7.4 14.1L2 9.3L9.2 8.6L12 2Z" fill="url(#star-grad-chk)" stroke="#b8e83e" stroke-width="1.5"/>
            <defs>
              <linearGradient id="star-grad-chk" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                <stop stop-color="#823fef"/>
                <stop offset="1" stop-color="#b8e83e"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <p class="auth-page__brand" style="margin: 0;">Stargym Checkout</p>
      </div>
      <h1 class="auth-page__title">Confirmar Membresía</h1>
      <p class="auth-page__subtitle">Estás a un paso de comenzar tu transformación.</p>

      <section class="checkout-summary">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
          <span style="color: var(--text-muted); font-weight: 600;">Plan Seleccionado:</span>
          <b id="checkout-plan-name" style="color: var(--primary-lime); font-size: 1.15rem;">—</b>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="color: var(--text-muted); font-weight: 600;">Total a pagar:</span>
          <b id="checkout-plan-price">$0.00</b>
        </div>
        <div style="margin-top: 1.25rem; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 1.15rem;">
          <p style="font-size: 0.82rem; color: var(--primary-lime); margin-bottom: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;">Beneficios incluidos:</p>
          <ul id="checkout-plan-benefits" style="list-style: none; font-size: 0.92rem; display: grid; gap: 0.65rem; color: var(--text);">
          </ul>
        </div>
      </section>

      <div class="auth-form">
        <p id="wallet-info" style="font-size: 0.92rem; color: var(--text-muted); text-align: center; margin-bottom: 0.85rem; padding: 0.65rem; background: rgba(0,0,0,0.3); border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.05);">
          Tu saldo actual: <b id="user-balance" style="color: var(--primary-lime);">—</b>
        </p>
        
        <button type="button" class="btn btn-purple btn-block" id="pay-wallet-btn">Pagar con mi Cartera Stargym</button>
        
        <div style="display: flex; align-items: center; gap: 1rem; margin: 0.85rem 0;">
            <hr style="flex: 1; border: none; height: 1px; background: rgba(255,255,255,0.1);">
            <span style="font-size: 0.78rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700;">O paga con</span>
            <hr style="flex: 1; border: none; height: 1px; background: rgba(255,255,255,0.1);">
        </div>

        <button type="button" class="btn btn-primary btn-block" id="pay-paypal-btn" disabled>
          <svg class="payment-provider__logo payment-provider__logo--paypal" viewBox="0 0 32 24" aria-hidden="true" focusable="false">
            <path d="M12.1 2h8.1c4.2 0 6.3 2.2 5.6 6.2-.7 4.1-3.3 6.2-7.5 6.2h-2.6l-1.1 7.1H8.7L12.1 2Z" fill="#009CDE" />
            <path d="M8.2 5.4h8.1c4.2 0 6.3 2.2 5.6 6.2-.7 4.1-3.3 6.2-7.5 6.2h-2.6l-1.1 7.1H4.8L8.2 5.4Z" fill="#003087" />
          </svg>
          Pagar membresía con PayPal
        </button>
        <button type="button" class="btn btn-outline btn-block" id="pay-binance-btn" disabled>
          <svg class="payment-provider__logo payment-provider__logo--binance" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <path fill="#F0B90B" d="m16 2.8 4 4-4 4-4-4 4-4Zm-8 8 4 4-4 4-4-4 4-4Zm16 0 4 4-4 4-4-4 4-4Zm-8 8 4 4-4 4-4-4 4-4Zm0-8 4 4-4 4-4-4 4-4Zm-8-4 3 3-3 3-3-3 3-3Zm16 0 3 3-3 3-3-3 3-3Zm-8 16 3 3-3 3-3-3 3-3Z" />
          </svg>
          Pagar membresía con Binance Pay
        </button>
        <p class="payment-methods__hint" style="text-align: center;">
          El pago cubre un mes. La renovación es manual y debes pagar de nuevo cada mes.
        </p>
      </div>

      <p class="auth-feedback" id="checkout-feedback" hidden role="status"></p>
      
      <div class="auth-page__footer" style="text-align: center;">
        <a href="index.html#planes" style="font-size: 0.9rem; opacity: 0.75;">Cambiar plan o cancelar</a>
      </div>
    </main>

    <script src="js/script.js"></script>
    <script src="js/session-ui.js"></script>
    <script src="js/checkout.js"></script>
  </body>
</html>
