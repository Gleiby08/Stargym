<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verificar correo | Stargym</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2L14.8 8.6L22 9.3L16.6 14.1L18.2 21.2L12 17.5L5.8 21.2L7.4 14.1L2 9.3L9.2 8.6L12 2Z' fill='%23b8e83e' stroke='%23823fef' stroke-width='1.5'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-page__card" style="text-align: center;">
      <div style="display: inline-flex; align-items: center; gap: 0.65rem; margin-bottom: 0.85rem;">
        <span class="logo-icon-emblem" aria-hidden="true" style="width: 2rem; height: 2rem;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L14.8 8.6L22 9.3L16.6 14.1L18.2 21.2L12 17.5L5.8 21.2L7.4 14.1L2 9.3L9.2 8.6L12 2Z' fill="url(#star-grad-vrf)" stroke="#b8e83e" stroke-width="1.5"/>
            <defs>
              <linearGradient id="star-grad-vrf" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                <stop stop-color="#823fef"/>
                <stop offset="1" stop-color="#b8e83e"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <p class="auth-page__brand" style="margin: 0;">Stargym Access</p>
      </div>
      <h1 class="auth-page__title">Activa tu cuenta</h1>
      <p class="auth-page__subtitle">Te enviamos un código de seis dígitos. Escríbelo aquí para verificar tu correo.</p>
      <form class="auth-form" id="verify-page-form" novalidate>
        <label class="form-field">
          <span class="form-label">Correo electrónico</span>
          <input type="email" name="email" autocomplete="email" required placeholder="tu@email.com" />
        </label>
        <label class="form-field">
          <span class="form-label">Código de verificación</span>
          <input id="verification-code" type="text" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required placeholder="000000" aria-describedby="verify-status" />
        </label>
        <button type="submit" class="btn btn-primary btn-block">Activar cuenta</button>
      </form>
      <p class="auth-feedback" id="verify-status" hidden role="status" aria-live="polite"></p>
      <button type="button" class="btn btn-outline btn-block" id="resend-verification">Reenviar código</button>
      <p class="auth-page__footer"><a href="login.html">Ir a iniciar sesión</a></p>
      <p class="auth-page__footer"><a href="index.html">Volver al inicio</a></p>
    </main>
    <script src="js/verify.js"></script>
  </body>
</html>
